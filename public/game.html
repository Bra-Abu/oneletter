<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>OneLetter</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet" />
</head>
<body class="game-page">

  <!-- ── TOP TIMER BAR ─────────────────────────────────────────────────────── -->
  <div class="top-timer-bar hidden" id="topTimerBar">
    <div class="top-timer-fill" id="topTimerFill"></div>
  </div>

  <!-- ── TOP BAR ─────────────────────────────────────────────────────────── -->
  <header class="game-header" id="gameHeader">

    <!-- Player 0 (left) -->
    <div class="player-block" id="playerBlock0" aria-label="Player 1">
      <div class="avatar" id="avatar0" aria-hidden="true">?</div>
      <div class="player-meta">
        <div class="player-name" id="pname0">—</div>
        <div class="player-score" id="pscore0">0 W</div>
        <span class="you-badge hidden" id="youBadge0">YOU</span>
      </div>
    </div>

    <!-- Timer (centre) -->
    <div class="timer-centre">
      <div class="timer-ring-wrap">
        <svg viewBox="0 0 72 72">
          <circle class="ring-bg" cx="36" cy="36" r="30"/>
          <circle class="ring-fg" id="timerRing" cx="36" cy="36" r="30"
                  stroke-dasharray="188.5" stroke-dashoffset="0"/>
        </svg>
        <span class="timer-num" id="timerText">10</span>
      </div>
      <div class="turn-badge" id="turnLabel">Your turn</div>
    </div>

    <!-- Player 1 (right) -->
    <div class="player-block right" id="playerBlock1" aria-label="Player 2">
      <div class="player-meta right">
        <div class="player-name" id="pname1">—</div>
        <div class="player-score" id="pscore1">0 W</div>
        <span class="you-badge hidden" id="youBadge1">YOU</span>
      </div>
      <div class="avatar p1" id="avatar1" aria-hidden="true">?</div>
    </div>

  </header>

  <!-- ── CONNECTING / WAITING ────────────────────────────────────────────── -->
  <div id="connectingState" class="overlay-state">
    <div class="spinner"></div>
    <p>Connecting…</p>
  </div>

  <div id="waitingState" class="overlay-state hidden">
    <div class="spinner"></div>
    <p>Waiting for opponent to join…</p>
    <div class="room-code-display" id="gameRoomCodeDisplay">—</div>
    <div class="link-row">
      <input id="gameLinkInput" class="input-field small" readonly />
      <button class="btn-copy" id="btnGameCopyLink">Copy</button>
    </div>
  </div>

  <!-- ── PLAYING AREA ────────────────────────────────────────────────────── -->
  <main id="gameMain" class="game-main hidden">

    <!-- Word hero -->
    <section class="word-hero" id="wordHeroSection" aria-label="Current word">
      <p class="word-hero-label" id="wordHeroLabel" aria-hidden="true">Change one letter</p>
      <div class="word-tiles" id="wordTiles" role="group" aria-label="Word tiles — tap a letter to select it"></div>
      <div class="tap-hint hidden" id="tapHint">👆 Tap any letter to change it</div>
    </section>

    <!-- Input zone -->
    <section class="input-zone" id="inputZone" aria-label="Your move">
      <div class="input-row">
        <input id="wordInput" class="word-input"
               type="text" maxlength="8"
               placeholder="Type your word…"
               autocomplete="off" autocorrect="off"
               autocapitalize="none" spellcheck="false"
               aria-label="Type your word"
               aria-describedby="inputHint" />
      </div>
      <div class="diff-strip" id="diffTiles" aria-hidden="true"></div>
      <p class="input-hint" id="inputHint" role="status" aria-live="polite"></p>
      <button class="submit-btn" id="submitBtn" disabled aria-label="Submit word">Submit</button>
    </section>

    <!-- Opponent thinking -->
    <p class="thinking-label hidden" id="opponentThinking">
      Opponent is thinking<span class="dots"></span>
    </p>

    <!-- Move history -->
    <section class="history-section">
      <div class="history-chain" id="historyChain"></div>
    </section>

  </main>

  <!-- ── GAME CONTROLS (subtle, bottom corner) ─────────────────────────── -->
  <div class="game-controls" role="toolbar" aria-label="Game controls">
    <button class="ctrl-btn" id="btnGiveUp" title="Give up" aria-label="Give up this game">🏳</button>
    <button class="ctrl-btn" id="soundToggle" title="Toggle sound" aria-label="Toggle sound">🔊</button>
    <a href="/" class="ctrl-btn" title="Home" aria-label="Return to home">⌂</a>
  </div>

  <!-- Screen-reader announcer for turn changes -->
  <div id="ariaAnnouncer" aria-live="assertive" aria-atomic="true" class="sr-only"></div>

  <!-- ── GAME OVER ──────────────────────────────────────────────────────── -->
  <div id="gameOverScreen" class="go-screen hidden">
    <div class="go-box">

      <!-- Result -->
      <div class="go-icon" id="resultIcon">🏆</div>
      <h2 class="go-title" id="resultTitle">You Win!</h2>
      <p class="go-reason" id="resultReason"></p>

      <!-- Scoreboard: both players + session wins -->
      <div class="go-scoreboard" id="goScoreboard"></div>

      <!-- Rating / streak stats (arrive via stats_update) -->
      <div class="go-stats" id="statsRow"></div>

      <!-- Full word chain -->
      <div class="go-chain-wrap">
        <p class="go-chain-label">Word chain</p>
        <div class="history-chain go-chain" id="finalChain"></div>
      </div>

      <!-- Primary action -->
      <button class="btn-primary go-play-again" id="btnRematch">Play Again</button>
      <p class="rematch-status hidden" id="rematchStatus"></p>

      <!-- Secondary actions -->
      <div class="go-secondary">
        <a href="/" class="btn-ghost">New Game</a>
        <button class="btn-ghost" id="btnShareResult">Share</button>
      </div>

    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/game.js"></script>
</body>
</html>
